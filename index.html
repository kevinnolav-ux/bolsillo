<style>
:root{
--bg:#010603; --surface:#04100A; --sunk:#071A0F; --line:#0F3A1F;
--ink:#C6FFD8; --muted:#5FA97A; --accent:#00FF6A; --accent-ink:#001A0A; --accent-soft:#05301A;
--in:#00FF6A; --out:#FF3D63; --warn:#E6FF3B; --glow:rgba(0,255,106,.35);
--c1:#00FF6A; --c2:#7DFFB2; --c3:#B8FF3B; --c4:#00C46A; --c5:#3DFFC5; --c6:#2E9E5B; --c7:#E0FFE9; --c8:#5BFF3B;
--f-display:"Share Tech Mono", "Cascadia Mono", Consolas, monospace;
--f-body:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
--f-num:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
--r:4px;
color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.label{font-family:var(--f-display);font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:400}
.app{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:20px;padding-block:16px 108px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:3px;background:var(--accent);box-shadow:0 0 14px var(--glow);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:17px}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-shadow:0 0 10px var(--glow)}
.brand b::after{content:"_";animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(4,1fr);
padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
nav.tabs button{background:none;border:0;padding:8px 4px;border-radius:3px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
nav.tabs button{font-family:var(--f-display);font-weight:400;letter-spacing:.04em}
.side-brand{display:none}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.month button:hover{background:var(--sunk);color:var(--ink)}
.month span{min-width:128px;font-family:var(--f-display);font-weight:400;letter-spacing:.06em;color:var(--accent);text-align:center;font-weight:600;text-transform:capitalize}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.view-title{font-size:26px;font-weight:400;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);text-shadow:0 0 12px var(--glow)}
.view-title::before{content:"> ";color:var(--muted)}
.sec-head h2{font-weight:400;text-transform:uppercase;letter-spacing:.06em}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px)}
.card{box-shadow:0 0 18px rgba(0,255,106,.05)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:4px;padding:12px 14px;font-size:14px}
.notice b{font-weight:700}
.balance{position:relative;overflow:hidden;background:var(--surface);color:var(--ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--accent);box-shadow:0 0 0 1px var(--accent-soft),0 0 28px var(--glow) inset}
.balance > *:not(canvas){position:relative;z-index:1}
.balance canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.22;z-index:0;pointer-events:none}
.balance .big{color:var(--accent);text-shadow:0 0 14px var(--glow)}
.balance .label{color:var(--muted)}
.balance .big{font-size:clamp(30px,8vw,42px);font-weight:600;line-height:1.05}
.flows{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flows div{background:color-mix(in srgb, var(--bg) 70%, transparent);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.flows .num{font-size:17px}
.savings-rate{font-size:13.5px;color:var(--muted)}
.savings-rate b{color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr;gap:18px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-head h2{font-size:18px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.cat-rows{display:flex;flex-direction:column;gap:14px}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.cat-row .name{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.cat-row .amt{font-size:13.5px;color:var(--muted);text-align:right}
.cat-row .amt b{color:var(--ink);font-weight:600}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--sunk);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.pill.ok{background:color-mix(in srgb, var(--in) 16%, transparent);color:var(--in)}
.pill.warn{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
.pill.over{background:color-mix(in srgb, var(--out) 16%, transparent);color:var(--out)}
.day-group{display:flex;flex-direction:column}
.day-label{font-size:12.5px;font-weight:600;color:var(--muted);padding:12px 2px 6px;text-transform:capitalize}
.mov{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.mov:last-child{border-bottom:0}
.mov:hover{background:var(--sunk)}
.mov .ic{width:36px;height:36px;border-radius:3px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px}
.mov .t{min-width:0}
.mov .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .t small{color:var(--muted);font-size:13px}
.mov .v{font-weight:600;font-size:15px}
.v.in{color:var(--in);text-shadow:0 0 8px var(--glow)} .v.out{color:var(--out)}
.tag-demo{font-size:10.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 10px var(--glow)}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:6px 14px}
.trend svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.goals{display:grid;grid-template-columns:1fr;gap:14px}
.goal{display:flex;flex-direction:column;gap:10px}
.goal-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal h3{font-size:18px}
.goal .meta{font-size:13.5px;color:var(--muted)}
.ring{flex:none;filter:drop-shadow(0 0 6px var(--glow))}
.goal .actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:9px 14px;font-weight:600}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--out);border-color:color-mix(in srgb, var(--out) 40%, var(--line))}
.btn.danger.armed{background:var(--out);color:#000;border-color:var(--out)}
.fab{position:fixed;z-index:21;right:calc(16px + env(safe-area-inset-right, 0px));bottom:calc(84px + env(safe-area-inset-bottom, 0px));
height:54px;padding:0 20px 0 16px;border-radius:4px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;
display:flex;align-items:center;gap:8px;box-shadow:0 0 24px var(--glow);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-display);font-weight:400}
.fab svg{width:22px;height:22px}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{color:var(--ink);font-size:19px}
.empty p{margin:0;max-width:40ch}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--accent);box-shadow:0 0 30px var(--glow);width:100%;max-width:520px;border-radius:6px 6px 0 0;max-height:92%;overflow:auto;
padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px;font-weight:400;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:4px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px;border-radius:2px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb, #000 15%, transparent)}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:11px 12px;width:100%;min-width:0}
.amount-input{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:6px 14px}
.amount-input span{font-family:var(--f-num);font-size:24px;color:var(--muted)}
.amount-input input{border:0;background:none;font-family:var(--f-num);font-size:30px;font-weight:600;width:100%;min-width:0;padding:6px 8px;outline:none}
.amount-input:focus-within{border-color:var(--accent)}
.cat-pick{display:flex;flex-wrap:wrap;gap:8px}
.cat-pick button{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:7px 11px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.cat-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 0 10px var(--glow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.err{color:var(--out);font-size:13.5px;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.toast{border:1px solid var(--accent);box-shadow:0 0 16px var(--glow);font-family:var(--f-display);left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--surface);color:var(--accent);padding:10px 16px;border-radius:4px;font-weight:600;font-size:14px}
footer.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.fx{position:fixed;inset:0;z-index:80;background:#000;display:grid;place-items:center;padding:24px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px))}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-box{position:relative;z-index:1;max-width:460px;width:100%;background:rgba(1,8,4,.86);border:1px solid var(--accent);box-shadow:0 0 40px var(--glow),inset 0 0 30px rgba(0,255,106,.12);padding:24px 22px;display:flex;flex-direction:column;gap:12px;font-family:var(--f-display)}
.fx-kicker{color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.fx-title{color:var(--accent);font-size:clamp(24px,6.5vw,34px);line-height:1.1;text-transform:uppercase;letter-spacing:.04em;text-shadow:0 0 18px var(--glow);margin:0;min-height:1.1em;overflow-wrap:anywhere}
.fx-msg{color:var(--ink);font-family:var(--f-body);font-size:16px;margin:0}
.fx-code{color:var(--muted);font-size:12.5px;margin:0;white-space:pre-wrap}
.fx-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.fx-pills .btn{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-weight:400}
.glyph{font-style:normal;font-family:var(--f-num);font-size:15px;line-height:1;width:18px;text-align:center;color:var(--gc,var(--accent));text-shadow:0 0 8px var(--gc,var(--accent));flex:none;display:inline-block}
.cat-pick button{position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s,background .15s}
.cat-pick button::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0,rgba(0,255,106,.18) 50%,transparent 100%);transform:translateY(-100%);pointer-events:none}
.cat-pick button:hover,.cat-pick button:focus-visible{border-color:var(--accent);box-shadow:0 0 14px var(--glow);color:var(--accent);transform:translateY(-1px)}
.cat-pick button:active{transform:scale(.97)}
.cat-pick button.scan::before{animation:scan .5s ease-out}
@keyframes scan{to{transform:translateY(100%)}}
.cat-pick button[aria-pressed="true"] .glyph{color:var(--accent-ink);text-shadow:none}
.cat-row .bar i{box-shadow:0 0 8px var(--glow)}
.mov:hover .ic{box-shadow:0 0 12px var(--glow)}
.mov .ic{font-family:var(--f-num);font-size:17px;text-shadow:0 0 8px currentColor}
@media (prefers-reduced-motion:reduce){.cat-pick button,.cat-pick button::before{transition:none;animation:none!important}}
.intro{position:fixed;inset:0;z-index:90;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity .6s ease}
.intro.out{opacity:0;pointer-events:none}
.intro canvas{position:absolute;inset:0;width:100%;height:100%}
.intro-box{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:0 max(20px, env(safe-area-inset-left, 0px));background:radial-gradient(closest-side,rgba(0,0,0,.92),rgba(0,0,0,0));padding-block:40px}
.intro-name{font-family:var(--f-display);color:var(--accent);font-size:clamp(38px,12vw,76px);letter-spacing:.18em;text-shadow:0 0 22px var(--glow),0 0 4px var(--accent);margin:0;min-height:1.1em}
.intro-log{font-family:var(--f-num);color:var(--muted);font-size:13px;text-align:left;min-height:5.4em;margin:0;white-space:pre}
.intro-hello{font-family:var(--f-display);color:var(--ink);font-size:clamp(18px,5vw,28px);letter-spacing:.12em;text-shadow:0 0 14px var(--glow);min-height:1.3em}
.intro-skip{font-family:var(--f-display);color:var(--muted);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
@media (min-width:900px){
.app{grid-template-columns:200px 1fr;gap:32px;padding-block:28px 40px}
nav.tabs{position:sticky;top:calc(28px + env(safe-area-inset-top, 0px));align-self:start;display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:0}
nav.tabs button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:10px 12px}
.side-brand{display:flex;margin-bottom:18px;padding-left:6px}
.top .brand{display:none}
.grid2{grid-template-columns:1.1fr 1fr;align-items:start}
.goals{grid-template-columns:1fr 1fr}
.fab{bottom:calc(28px + env(safe-area-inset-bottom, 0px));right:calc(32px + env(safe-area-inset-right, 0px))}
.toast{bottom:100px}
.overlay{align-items:center}
.sheet{border-radius:6px}
}
@media (prefers-reduced-motion:no-preference){
.sheet{animation:up .22s ease-out}

<body>
<div class="intro" id="intro" role="presentation"><canvas id="introc" aria-hidden="true"></canvas>
<div class="intro-box"><h1 class="intro-name" id="introName">BOLSILLO</h1><div class="intro-hello" id="introHello"></div><p class="intro-log" id="introLog"></p><div class="intro-skip">Toca para entrar</div></div></div>
<div class="app">
<nav class="tabs" aria-label="Secciones">
<div class="brand side-brand"><div class="mark">B</div><b>Bolsillo</b></div>
<button data-view="resumen" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
<button data-view="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>Movimientos</button>
<button data-view="presup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg>Presupuesto</button>
<button data-view="metas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Metas</button>
</nav>
<main>
<header class="top">
<div class="brand"><div class="mark">B</div><b>Bolsillo</b></div>
<div class="month" role="group" aria-label="Mes">
<button id="prevM" aria-label="Mes anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<span id="monthLabel">octubre 2026</span>
<button id="nextM" aria-label="Mes siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
</header>
<div id="notice"></div>
<div id="view"></div>
<footer class="meta" id="footer"></footer>
</main>
</div>
<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Registrar</button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<div id="fxRoot"></div>
<script>
(function(){

function trendChart(){
const yms=[]; for(let k=5;k>=0;k--) yms.push(shiftYM(S.ym,-k));
const data=yms.map(ym=>{const t=totals(ym);return {ym,ing:t.ing,gas:t.gas};});
const max=Math.max(1,...data.map(d=>Math.max(d.ing,d.gas)));
const step = niceStep(max/3); const top = Math.ceil(max/step)*step;
const W=360,H=180,L=44,R=6,T=10,B=24; const cw=(W-L-R)/6; const y=v=>T+(H-T-B)*(1-v/top);
let g="";
for(let v=0;v<=top+1;v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${short(v)}</text>`; }
data.forEach((d,i)=>{
const x0=L+i*cw+cw*.18, bw=cw*.3; const cur=d.ym===S.ym;
g+=`<rect x="${x0}" y="${y(d.ing)}" width="${bw}" height="${Math.max(0,y(0)-y(d.ing))}" rx="3" fill="var(--in)" opacity="${cur?1:.55}"><title>Ingresos ${money(d.ing)}</title></rect>`;
g+=`<rect x="${x0+bw+2}" y="${y(d.gas)}" width="${bw}" height="${Math.max(0,y(0)-y(d.gas))}" rx="3" fill="var(--out)" opacity="${cur?1:.55}"><title>Gastos ${money(d.gas)}</title></rect>`;
const lbl=new Date(d.ym+"-02").toLocaleDateString("es-CO",{month:"short"}).replace(".","");
g+=`<text x="${L+i*cw+cw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="${cur?"var(--ink)":"var(--muted)"}" font-weight="${cur?700:500}" font-family="Figtree, sans-serif">${lbl}</text>`;
});
return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos seis meses">${g}</svg>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x||1))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

let rainRAF=null;
function startRain(){
cancelAnimationFrame(rainRAF); const cv=document.getElementById("rain"); if(!cv) return;
const ctx=cv.getContext("2d"); const dpr=Math.min(2,window.devicePixelRatio||1);
const w=cv.clientWidth, h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; ctx.scale(dpr,dpr);
const fs=14, cols=Math.ceil(w/fs); const drops=Array.from({length:cols},()=>Math.random()*-h/fs);
const glyphs="ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ0123456789$%COP+-".split("");
const color=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#00FF6A";
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
ctx.font=fs+"px IBM Plex Mono, monospace";
let last=0;
function frame(t){
if(!cv.isConnected) return;
if(t-last>70){ last=t;
ctx.fillStyle="rgba(4,16,10,.18)"; ctx.fillRect(0,0,w,h);
ctx.fillStyle=color;
for(let i=0;i<cols;i++){ const ch=glyphs[(Math.random()*glyphs.length)|0]; ctx.fillText(ch,i*fs,drops[i]*fs);
if(drops[i]*fs>h&&Math.random()>.96) drops[i]=0; drops[i]+=1; }
}
if(!reduce) rainRAF=requestAnimationFrame(frame);
}
